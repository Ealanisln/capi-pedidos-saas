<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vibecoding con agentes IA</title>
  <desc id="desc">Cómo usar Codex, Claude, Gemini, Cursor y otros agentes para colaborar en el proyecto.</desc>
  <rect width="1200" height="500" rx="36" fill="#13201d"/>
  <circle cx="1050" cy="90" r="180" fill="#06d6a0" opacity="0.22"/>
  <circle cx="170" cy="410" r="190" fill="#ffd166" opacity="0.18"/>
  <text x="70" y="90" fill="#9cf2df" font-family="Arial, sans-serif" font-size="24" font-weight="800">Guía para vibecoding responsable</text>
  <text x="70" y="142" fill="#ffffff" font-family="Arial, sans-serif" font-size="50" font-weight="900">IA sí, pero con contexto, pruebas y seguridad.</text>
  <g font-family="Arial, sans-serif" font-weight="700">
    <rect x="70" y="215" width="190" height="125" rx="26" fill="#ffffff"/>
    <text x="108" y="266" fill="#13201d" font-size="26">Codex</text>
    <text x="108" y="300" fill="#49635d" font-size="16">Implementar</text>
    <rect x="300" y="215" width="190" height="125" rx="26" fill="#9cf2df"/>
    <text x="338" y="266" fill="#06332b" font-size="26">Claude</text>
    <text x="338" y="300" fill="#07594b" font-size="16">Analizar docs</text>
    <rect x="530" y="215" width="190" height="125" rx="26" fill="#ffe9a7"/>
    <text x="568" y="266" fill="#3a2600" font-size="26">Gemini</text>
    <text x="568" y="300" fill="#684600" font-size="16">Revisar ideas</text>
    <rect x="760" y="215" width="190" height="125" rx="26" fill="#ffb47d"/>
    <text x="798" y="266" fill="#401500" font-size="26">Cursor</text>
    <text x="798" y="300" fill="#6e2600" font-size="16">Editar rápido</text>
    <rect x="990" y="215" width="140" height="125" rx="26" fill="#ffffff" opacity="0.14"/>
    <text x="1020" y="266" fill="#ffffff" font-size="24">Otros</text>
    <text x="1020" y="300" fill="#d5fff6" font-size="16">Validar</text>
  </g>
  <text x="70" y="414" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Regla de oro: ningún agente debe tocar credenciales reales, romper tenantId o prometer funciones no implementadas.</text>
</svg>
