    <text x="612" y="284" fill="#684600" font-size="15">ORM</text>
    <text x="612" y="306" fill="#684600" font-size="15">TenantId</text>
    <rect x="820" y="210" width="180" height="108" rx="22" fill="#ffb47d"/>
