<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura Capi Pedidos SaaS</title>
  <desc id="desc">Diagrama visual de las capas de Capi: cliente, Next.js, autenticación, Prisma, PostgreSQL, WhatsApp y Vercel.</desc>
  <rect width="1200" height="520" rx="36" fill="#fff7e8"/>
  <circle cx="1040" cy="82" r="170" fill="#9cf2df" opacity="0.55"/>
  <circle cx="120" cy="440" r="190" fill="#ffd166" opacity="0.55"/>
  <rect x="70" y="64" width="1060" height="392" rx="30" fill="#13201d"/>
  <text x="100" y="118" fill="#9cf2df" font-family="Arial, sans-serif" font-size="24" font-weight="700">Capi Pedidos SaaS</text>
  <text x="100" y="152" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="800">Arquitectura general</text>
  <g font-family="Arial, sans-serif" font-weight="700">
